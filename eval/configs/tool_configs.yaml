# Tool configurations
# Provides default configuration parameters for each tool

# CodeInterpreter configuration
code_interpreter:
  work_dir: ""
  output_timeout: 30

  
# Zoom configuration
zoom:
  work_dir: ""
  output_timeout: 30


# WebSearch configuration
web_search:
  max_results: 10
  timeout: 10


# Visit configuration
visit:
  max_content_length: 150000
  timeout: 120
  use_llm_summary: false

# ImageSearch configuration
image_search:
  imgbb_api_key: ""
  max_results: 5
  search_image_max_pixels: 1000000
  search_image_quality: 85
